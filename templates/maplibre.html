    </div>
        <!-- Waypoint Creation Modal -->

    <button id="open-track-filters-button" class="hidden" type="button">Filtres</button>
    <div id="track-filters">

            <button id="toggle-track-filters" class="secondary toggle" type="button">Afficher</button>

                    <option value="">Toutes les collections</option>

            </div>
            <div class="filter-row">
                <label for="filter-name">Nom</label>
                <input id="filter-name" type="search" list="track-name-list" placeholder="Recherche de nom..." />

            <div class="filter-row">
                <label for="filter-type">Type</label>
                <input id="filter-type" type="search" list="track-type-list" placeholder="Contient..." />

            </div>
            <div class="filter-row">
                <label>Longueur (km)</label>
                <div style="display:flex; gap:10px;">
                    <input id="filter-length-min" type="number" min="0" step="0.1" placeholder="min" />
                    <input id="filter-length-max" type="number" min="0" step="0.1" placeholder="max" />

            <div class="filter-actions">
                <button id="apply-track-filters">Appliquer</button>
                <button id="clear-track-filters" class="secondary" type="button">Réinitialiser</button>
            </div>
        </div>
    </div>

        let measureMode = false;
        let measurePoints = [];
        const measureButton = document.getElementById('measure-distance-button');

        function resetMeasurement() {
            measurePoints = [];
            if (map && map.getSource('measure-distance')) {
                map.getSource('measure-distance').setData({
                    type: 'FeatureCollection',
                    features: []
                });
            }
            if (measurePanel) {
                measurePanel.innerHTML = 'Cliquez sur la carte pour ajouter des points.';
            }
            if (measureButton) {
                measureButton.textContent = '📏 Mesurer';
                measureButton.classList.remove('active');
            }
            if (map) {
                map.getCanvas().style.cursor = '';
            }
        }

        function haversineDistanceMeters(pointA, pointB) {
            const toRad = (value) => (value * Math.PI) / 180;
            const earthRadius = 6371000;
            const deltaLat = toRad(pointB.lat - pointA.lat);
            const deltaLng = toRad(pointB.lng - pointA.lng);
            const latA = toRad(pointA.lat);
            const latB = toRad(pointB.lat);
            const a = Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
                Math.sin(deltaLng / 2) * Math.sin(deltaLng / 2) * Math.cos(latA) * Math.cos(latB);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return earthRadius * c;
        }

        function updateMeasurementDisplay() {
            if (measurePoints.length < 2) {
                if (measurePanel) {
                    measurePanel.innerHTML = measurePoints.length === 1
                        ? '1 point ajouté. Ajoutez un second point pour calculer la distance.'
                        : 'Cliquez sur la carte pour ajouter des points.';
                }
                return;
            }

            const totalDistance = measurePoints.reduce((sum, point, index) => {
                if (index === 0) return sum;
                return sum + haversineDistanceMeters(measurePoints[index - 1], point);
            }, 0);

            if (measurePanel) {
                measurePanel.innerHTML = `<strong>${(totalDistance / 1000).toFixed(2)} km</strong><br/>Cliquez pour ajouter un point ou relancez la mesure pour recommencer.`;
            }
        }

        function addMeasurePoint(lngLat) {
            measurePoints.push({ lng: lngLat.lng, lat: lngLat.lat });
            const features = [];

            if (measurePoints.length > 0) {
                features.push({
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [measurePoints[0].lng, measurePoints[0].lat]
                    },
                    properties: {
                        id: 'start',
                        kind: 'start'
                    }
                });
            }

            if (measurePoints.length > 1) {
                features.push({
                    type: 'Feature',
                    geometry: {
                        type: 'LineString',
                        coordinates: measurePoints.map((point) => [point.lng, point.lat])
                    },
                    properties: {
                        kind: 'path'
                    }
                });
            }

            if (measurePoints.length > 1) {
                features.push({
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [measurePoints[measurePoints.length - 1].lng, measurePoints[measurePoints.length - 1].lat]
                    },
                    properties: {
                        id: 'end',
                        kind: 'end'
                    }
                });
            }

            if (map && map.getSource('measure-distance')) {
                map.getSource('measure-distance').setData({
                    type: 'FeatureCollection',
                    features
                });
            }

            updateMeasurementDisplay();
        }

        function toggleMeasureMode() {
            measureMode = !measureMode;
            if (!measureMode) {
                resetMeasurement();
                return;
            }

            measurePoints = [];
            if (measurePanel) {
                measurePanel.innerHTML = 'Cliquez sur la carte pour ajouter des points.';
            }
            if (measureButton) {
                measureButton.textContent = '❌ Annuler';
                measureButton.classList.add('active');
            }
            if (map) {
                map.getCanvas().style.cursor = 'crosshair';
            }
        }

        if (measureButton) {
            measureButton.addEventListener('click', toggleMeasureMode);
        }

        const filterNameInput = document.getElementById('filter-name');
        const filterTypeInput = document.getElementById('filter-type');
        const filterCollectionSelect = document.getElementById('filter-collection');
        const filterTypeList = document.getElementById('track-type-list');
        const filterNameList = document.getElementById('track-name-list');
        const trackFiltersPanel = document.getElementById('track-filters-panel');
        const toggleFilterBtn = document.getElementById('toggle-track-filters');
        const openFiltersBtn = document.getElementById('open-track-filters-button');
        const filterMinInput = document.getElementById('filter-length-min');
        const filterMaxInput = document.getElementById('filter-length-max');
        const applyFilterBtn = document.getElementById('apply-track-filters');
        const clearFilterBtn = document.getElementById('clear-track-filters');

        let filtersVisible = false;

        function updateFilterButtons() {
            toggleFilterBtn.textContent = filtersVisible ? 'Masquer' : 'Afficher';
            openFiltersBtn.classList.toggle('hidden', filtersVisible);
        }

        toggleFilterBtn.addEventListener('click', () => {
            filtersVisible = !filtersVisible;
            trackFiltersPanel.style.display = filtersVisible ? 'block' : 'none';
            updateFilterButtons();
        });

        openFiltersBtn.addEventListener('click', () => {
            filtersVisible = true;
            trackFiltersPanel.style.display = 'block';
            updateFilterButtons();
        });

        filterCollectionSelect.addEventListener('change', () => {
            currentFilterState = getFilterState();
            redraw();
        });

        clearFilterBtn.addEventListener('click', () => {
            filterCollectionSelect.value = '';
            filterNameInput.value = '';
            filterTypeInput.value = '';
            filterMinInput.value = '';
            filterMaxInput.value = '';
            currentFilterState = getFilterState();
            redraw();
        });

        applyFilterBtn.addEventListener('click', () => {
            currentFilterState = getFilterState();
            redraw();
        });

        function getFilterState() {
            return {
                collectionId: filterCollectionSelect.value,
                name: filterNameInput.value.trim().toLowerCase(),
                type: filterTypeInput.value.trim().toLowerCase(),
                minLength: filterMinInput.value ? parseFloat(filterMinInput.value) * 1000 : null,
                maxLength: filterMaxInput.value ? parseFloat(filterMaxInput.value) * 1000 : null
            };
        }

        function applyTrackFilters(geojson) {
            if (!geojson || !geojson.features) return geojson;
            return {
                type: 'FeatureCollection',
                features: geojson.features.filter((feature) => {
                    const props = feature.properties || {};
                    const name = (props.name || '').toString().toLowerCase();
                    const type = (props.type || '').toString().toLowerCase();
                    const length = Number(props.length || 0);

                    if (currentFilterState.name && !name.includes(currentFilterState.name)) {
                        return false;
                    }

                    if (currentFilterState.type && currentFilterState.type !== '' && !type.includes(currentFilterState.type)) {
                        return false;
                    }

                    if (currentFilterState.minLength !== null && length < currentFilterState.minLength) {
                        return false;
                    }

                    if (currentFilterState.maxLength !== null && length > currentFilterState.maxLength) {
                        return false;
                    }

                    return true;
                })
            };
        }

        function populateTrackTypeOptions(geojson) {
            const types = new Set();
            if (!geojson || !geojson.features) return;
            geojson.features.forEach((feature) => {
                const type = (feature.properties?.type || '').toString().trim();
                if (type) {
                    types.add(type);
                }
            });
            filterTypeList.innerHTML = '';
            Array.from(types).sort().forEach((type) => {
                const option = document.createElement('option');
                option.value = type;
                filterTypeList.appendChild(option);
            });
        }

        function populateTrackNameOptions(geojson) {
            const names = new Set();
            if (!geojson || !geojson.features) return;
            geojson.features.forEach((feature) => {
                const name = (feature.properties?.name || '').toString().trim();
                if (name) {
                    names.add(name);
                }
            });
            filterNameList.innerHTML = '';
            Array.from(names).sort().forEach((name) => {
                const option = document.createElement('option');
                option.value = name;
                filterNameList.appendChild(option);
            });
        }

        function populateCollectionOptions(collections) {
            filterCollectionSelect.innerHTML = '<option value="">Toutes les collections</option>';
            collections.forEach((collection) => {
                const option = document.createElement('option');
                option.value = collection.id;
                option.textContent = collection.name;
                filterCollectionSelect.appendChild(option);
            });
        }

        function getActivityTypeIcon(type) {
            const icons = {
                RANDO: '🥾',
                HIKE: '🥾',
                OFFROAD: '🛻',
                BIKE: '🚴',
                RUN: '🏃'
            };
            return icons[(type || '').toUpperCase()] || '🧭';
        }

        function formatDuration(seconds) {
            if (!seconds || seconds <= 0) return null;
            const totalMinutes = Math.round(seconds / 60);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            if (hours === 0) return `${minutes} min`;
            if (minutes === 0) return `${hours} h`;
            return `${hours} h ${minutes}`;
        }

        // Naismith : 4 km/h + 1 h par 600 m de D+
        function estimateHikingDurationSeconds(lengthMeters, elevationGainMeters) {
            if (!lengthMeters || lengthMeters <= 0) return null;
            const distanceKm = lengthMeters / 1000;
            const gain = elevationGainMeters || 0;
            const hours = (distanceKm / 4) + (gain / 600);
            return Math.round(hours * 3600);
        }

        const HIKING_TYPES = new Set(['RANDO', 'HIKE']);

        function getHikingDurationLabel(props) {
            if (!HIKING_TYPES.has((props.type || '').toUpperCase())) return null;

            const recorded = Number(props.duration);
            if (recorded > 0) {
                const text = formatDuration(recorded);
                return text ? { text, isEstimate: false } : null;
            }

            const estimated = estimateHikingDurationSeconds(
                Number(props.length),
                Number(props.elevation_gain)
            );
            const text = formatDuration(estimated);
            return text ? { text, isEstimate: true } : null;
        }

        function renderTrackSidebar(geojson) {
            const list = document.getElementById('track-sidebar-list');
            if (!list) return;
            const features = geojson?.features || [];
            if (!features.length) {
                list.innerHTML = '<div id="track-sidebar-empty">Aucune trace affichée.</div>';
                return;
            }
            list.innerHTML = '';
            features.forEach((feature) => {
                const props = feature.properties || {};
                const item = document.createElement('div');
                item.className = 'track-item';

                const header = document.createElement('div');
                header.className = 'track-item-header';

                const typeIcon = document.createElement('span');
                typeIcon.className = 'track-type-icon';
                typeIcon.textContent = getActivityTypeIcon(props.type);
                typeIcon.title = props.type || 'Type inconnu';
                header.appendChild(typeIcon);

                const title = document.createElement('h4');
                title.className = 'track-item-title';
                title.textContent = props.name || 'Sans nom';
                header.appendChild(title);

                const trackId = feature.id || props.id;
                if (props.is_owner && trackId) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.type = 'button';
                    deleteBtn.className = 'track-delete-btn';
                    deleteBtn.textContent = '🗑️';
                    deleteBtn.title = 'Supprimer cette trace';
                    deleteBtn.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        if (!confirm('Supprimer cette trace ?')) return;
                        deleteTrack(props.id);
                    });
                    header.appendChild(deleteBtn);
                }

                item.appendChild(header);

                const stats = document.createElement('div');
                stats.className = 'track-item-stats';
                const statParts = [
                    `<span class="track-stat"><span class="attr-icon">📏</span>${props.length ? `${(props.length / 1000).toFixed(1)} km` : 'N/A'}</span>`,
                    `<span class="track-stat"><span class="attr-icon">⛰️</span>${props.elevation_gain ? `${props.elevation_gain} m` : 'N/A'}</span>`
                ];
                const durationInfo = getHikingDurationLabel(props);
                if (durationInfo) {
                    const durationTitle = durationInfo.isEstimate
                        ? 'Durée estimée (4 km/h + 600 m D+ / h)'
                        : 'Durée enregistrée dans le GPX';
                    statParts.push(
                        `<span class="track-stat" title="${durationTitle}"><span class="attr-icon">⏱️</span>${durationInfo.text}${durationInfo.isEstimate ? ' ~' : ''}</span>`
                    );
                }
                stats.innerHTML = statParts.join('');
                item.appendChild(stats);

                item.addEventListener('click', () => {
                    document.querySelectorAll('.track-item.selected').forEach((el) => el.classList.remove('selected'));
                    item.classList.add('selected');
                    const bounds = new maplibregl.LngLatBounds();
                    const coords = feature.geometry?.coordinates || [];
                    if (feature.geometry?.type === 'LineString') {
                        coords.forEach((coord) => bounds.extend(coord));
                    } else if (feature.geometry?.type === 'MultiLineString') {
                        coords.forEach((line) => line.forEach((coord) => bounds.extend(coord)));
                    } else {
                        bounds.extend(coords);
                    }
                    if (!bounds.isEmpty()) {
                        map.fitBounds(bounds, { padding: 40, maxZoom: 15, duration: 600 });
                    }
                });

                list.appendChild(item);
            });
        }

        function deleteTrack(trackId) {
            fetch('/api/tracks/' + trackId, { method: 'DELETE' })
                .then((response) => {
                    if (response.ok) return response.json();
                    return response.json().then((json) => Promise.reject(json));
                })
                .then(() => {
                    redraw();
                })
                .catch((error) => {
                    console.error('Unable to delete track:', error);
                    alert('Impossible de supprimer la trace : ' + (error.error || error.message || 'Erreur serveur'));
                });
        }

        function loadCollectionOptions() {
            fetch('/api/collections')
                .then((response) => response.ok ? response.json() : [])
                .then((collections) => {
                    populateCollectionOptions(collections || []);
                })
                .catch((error) => {
                    console.warn('Unable to load collections:', error);
                });
        }

        function loadWaypoints() {
            fetch('/api/waypoints')
                .then((response) => {
                    if (response.status === 401) {
                        console.warn('Waypoints are available only for authenticated users.');
                        return [];
                    }
                    return response.ok ? response.json() : [];
                })

                    const waypointCollection = {
                        type: 'FeatureCollection',
                        features: (waypoints || []).map((wp) => ({
                            type: 'Feature',
                            properties: {
                                id: wp.id,
                                description: wp.description || 'Waypoint',
                                created_at: wp.created_at || null,
                                canEdit: true
                            },
                            geometry: {
                                type: 'Point',
                                coordinates: [wp.lng, wp.lat]
                            }
                        }))
                    };
                    if (map.getSource('waypoints')) {
                        map.getSource('waypoints').setData(waypointCollection);
                    }
                })
                .catch((error) => {
                    console.warn('Unable to load waypoints:', error);
                });
        }

                // console.log(feature.geometry.coordinates);

        });

                    const sw_lng = Math.round(sw.lng * 10000) / 10000;

                        tiles: [demSource.sharedDemProtocolUrl],

                        layout: { visibility: 'visible' },
                        paint: { 'hillshade-shadow-color': '#99742e' }
                    },

                id: 'color-relief',

                    'color-relief-color': [
                        'interpolate',

                        200, 'rgb(10, 21, 189)',
                        400, 'rgb(16, 44, 218)',

        function redraw() {
            const currentZoom = map.getZoom();
            const bounds = map.getBounds();
            const ne = bounds.getNorthEast(); // {lng, lat}
            const sw = bounds.getSouthWest(); // {lng, lat}
            const ne_lat = Math.round(ne.lat * 10000) / 10000;
            const ne_lng = Math.round(ne.lng * 10000) / 10000;
            const sw_lat = Math.round(sw.lat * 10000) / 10000;
            const sw_lng = Math.round(sw.lng * 10000) / 10000;
            const collectionId = currentFilterState.collectionId;
            const url = collectionId ? '/api/collection_tracks/' + collectionId : '/api/find_tracks?NW_lon=' + sw_lng + '&SE_lon=' + ne_lng + '&NW_lat=' + ne_lat + '&SE_lat=' + sw_lat;
            fetch(url)
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    currentTracksGeoJSON = data;
                    populateTrackTypeOptions(data);
                    populateTrackNameOptions(data);
                    const filtered = applyTrackFilters(data);
                    map.getSource("trails").setData(filtered);
                    renderTrackSidebar(filtered);
                });
        };

        document.getElementById('waypoint-form').addEventListener('submit', async (e) => {

            const description = document.getElementById('waypoint-description').value.trim();
            
            if (!creatingWaypointCoords) return;
            
            try {
                const response = await fetch('/api/waypoints', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lat: creatingWaypointCoords.lat,
                        lng: creatingWaypointCoords.lng,
                        description: description
                    })
                });
                
                if (response.ok) {
                    document.getElementById('waypoint-modal').close();
                    document.getElementById('waypoint-form').reset();
                    creatingWaypoint = false;
                    creatingWaypointCoords = null;
                    loadWaypoints();
                } else {
                    alert('Erreur lors de la création du waypoint');

                alert('Erreur: ' + err.message);

                        <button class="wp-delete-btn" data-id="${waypointId}" style="flex: 1; padding: 5px; cursor: pointer; background: #f44336; color: white; border: none; border-radius: 4px;">🗑️ Supprimer</button>

                `;
            }
            
            const popupHTML = '<div style="min-width: 200px;"><strong>' + description + '</strong>' +
                '<p>' +
                (createdAt ? 'Créé le: ' + createdAt + '<br>' : '') +
                '</p>' +

            const popup = new maplibregl.Popup()

            // Add event listeners to buttons after popup is rendered
            setTimeout(() => {
                const editBtn = document.querySelector('.wp-edit-btn');
                const deleteBtn = document.querySelector('.wp-delete-btn');
                
                if (editBtn) {
                    editBtn.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        const id = editBtn.dataset.id;
                        const desc = editBtn.dataset.description;
                        editWaypoint(id, desc);
                    });

                if (deleteBtn) {

                        const id = deleteBtn.dataset.id;
                        deleteWaypoint(id);
                    });
                }
            }, 0);
        });

        // Edit waypoint
        window.editWaypoint = function(waypointId, currentDescription) {
            const newDescription = prompt('Éditer la description:', currentDescription);
            if (newDescription !== null) {
                fetch('/api/waypoints/' + waypointId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: newDescription })
                })
                .then(r => r.ok ? r.json() : Promise.reject(r))
                .then(() => {
                    loadWaypoints();
                    // Close any open popups
                    document.querySelectorAll('.maplibregl-popup').forEach(p => p.remove());
                })
                .catch(err => {
                    console.error('Error updating waypoint:', err);
                    alert('Erreur lors de la mise à jour du waypoint');
                });
            }
        };

                    })
                    .catch(err => {

                    });
            }
        };
